name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(sed -n 's/^ *VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::CMakeLists.txt says VERSION $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config rpm \
            libx11-dev libxft-dev libxrender-dev libfontconfig1-dev libfreetype-dev \
            libssl-dev libharfbuzz-dev zlib1g-dev libjpeg-dev \
            libvulkan-dev libgl-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFIZMO_TUNE=OFF -DFIZMO_BUILD_NUMERICS_TESTS=ON -DFIZMO_PACKAGE_PLATFORM=linux-${{ matrix.arch }}

      - name: Build
        run: cmake --build build -j 4

      - name: Run the numerics tests
        run: build/fizmo-numerics-tests

      - name: Check each component links with only the components and system libraries it declares
        working-directory: build
        run: |
          check() {
            name=$1
            shift
            c++ -shared -o check.so -Wl,--whole-archive libfizmo_$name.a -Wl,--no-whole-archive "$@" -Wl,-z,defs -pthread -ldl -lm
            rm -f check.so
          }
          check core
          check random libfizmo_core.a
          check crypto libfizmo_random.a libfizmo_core.a
          check string libfizmo_random.a libfizmo_core.a
          for c in statistics numerics physics symbolic time collections system util; do
            check $c libfizmo_core.a
          done
          check net libfizmo_crypto.a libfizmo_random.a libfizmo_core.a -lssl -lcrypto
          check graphics libfizmo_system.a libfizmo_util.a libfizmo_string.a libfizmo_random.a libfizmo_core.a \
            -lz -ljpeg -lX11 -lXft -lXrender -lfontconfig -lfreetype \
            $(pkg-config --libs harfbuzz)

      - name: Package
        working-directory: build
        run: cpack -G "TGZ;TXZ;ZIP;DEB;RPM"

      - uses: actions/upload-artifact@v4
        with:
          name: fizmo-linux-${{ matrix.arch }}
          path: |
            build/fizmo-*.tar.gz
            build/fizmo-*.tar.xz
            build/fizmo-*.zip
            build/fizmo-*.deb
            build/fizmo-*.rpm
          if-no-files-found: error

  linux-i686:
    name: Linux i686
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and package in a 32-bit container
        run: |
          docker run --rm --platform linux/386 -v "$PWD:/src" -w /src i386/debian:bookworm bash -euo pipefail -c '
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates g++ cmake ninja-build pkg-config file rpm dpkg-dev \
              libx11-dev libxft-dev libxrender-dev libfontconfig-dev libfreetype-dev \
              libssl-dev libharfbuzz-dev zlib1g-dev libjpeg-dev \
              libvulkan-dev libgl-dev
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFIZMO_TUNE=OFF -DFIZMO_PACKAGE_PLATFORM=linux-i686
            cmake --build build -j 4
            cd build
            cpack -G "TGZ;TXZ;ZIP;DEB;RPM"
          '

      - uses: actions/upload-artifact@v4
        with:
          name: fizmo-linux-i686
          path: |
            build/fizmo-*.tar.gz
            build/fizmo-*.tar.xz
            build/fizmo-*.zip
            build/fizmo-*.deb
            build/fizmo-*.rpm
          if-no-files-found: error

  mingw:
    name: Windows ${{ matrix.platform }}
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-w64-mingw32
            platform: windows-ucrt64
          - target: i686-w64-mingw32
            platform: windows-i686
          - target: aarch64-w64-mingw32
            platform: windows-clangarm64
    env:
      LLVM_MINGW_VERSION: "20261020"
      LLVM_MINGW: llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64
      LLVM_MINGW_TARGET: ${{ matrix.target }}
      LLVM_MINGW_DEPS: ${{ github.workspace }}/windows-deps
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build nsis p7zip-full

      - name: Cache llvm-mingw
        id: llvm-mingw-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-mingw
          key: ${{ env.LLVM_MINGW }}

      - name: Download llvm-mingw
        if: steps.llvm-mingw-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 5 --retry-delay 10 -o /tmp/llvm-mingw.tar.xz "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$LLVM_MINGW.tar.xz"
          mkdir -p ~/llvm-mingw
          tar -xf /tmp/llvm-mingw.tar.xz -C ~/llvm-mingw --strip-components=1

      - name: Put llvm-mingw on the PATH
        run: echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH"

      - name: Cache the Windows libraries
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: windows-deps
          key: windows-deps-${{ matrix.target }}-${{ env.LLVM_MINGW }}-${{ hashFiles('.github/scripts/windows-deps.sh', 'cmake/llvm-mingw.cmake') }}

      - name: Build zlib, libjpeg-turbo and the Vulkan headers
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/windows-deps.sh "$LLVM_MINGW_TARGET" "$LLVM_MINGW_DEPS" "$RUNNER_TEMP/windows-deps-src"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFIZMO_TUNE=OFF \
            -DCMAKE_TOOLCHAIN_FILE=cmake/llvm-mingw.cmake \
            -DFIZMO_PACKAGE_PLATFORM=${{ matrix.platform }} \
            -DJPEG_LIBRARY="$LLVM_MINGW_DEPS/lib/libjpeg.a" -DJPEG_INCLUDE_DIR="$LLVM_MINGW_DEPS/include" \
            -DZLIB_LIBRARY="$LLVM_MINGW_DEPS/lib/libzs.a" -DZLIB_INCLUDE_DIR="$LLVM_MINGW_DEPS/include"

      - name: Build
        run: cmake --build build -j 4

      - name: Package
        working-directory: build
        run: cpack -G "ZIP;7Z;NSIS"

      - uses: actions/upload-artifact@v4
        with:
          name: fizmo-${{ matrix.platform }}
          path: |
            build/fizmo-*.zip
            build/fizmo-*.7z
            build/fizmo-*.exe
          if-no-files-found: error

  msvc:
    name: Windows MSVC ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install dependencies with vcpkg
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg -or -not (Test-Path "$vcpkg\vcpkg.exe")) {
            git clone --depth 1 https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
            & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
            $vcpkg = "$env:RUNNER_TEMP\vcpkg"
          }
          $triplet = "${{ matrix.arch }}-windows-static-md"
          & "$vcpkg\vcpkg.exe" install "zlib:$triplet" "libjpeg-turbo:$triplet" "vulkan-headers:$triplet"
          "VCPKG_ROOT_DIR=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Append
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFIZMO_TUNE=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET"
          -DFIZMO_PACKAGE_PLATFORM=windows-msvc-${{ matrix.arch }}

      - name: Build
        run: cmake --build build -j 4

      - name: Package
        working-directory: build
        run: |
          $env:PATH = "$env:PATH;${env:ProgramFiles(x86)}\NSIS"
          cpack -G "ZIP;7Z;NSIS"

      - uses: actions/upload-artifact@v4
        with:
          name: fizmo-windows-msvc-${{ matrix.arch }}
          path: |
            build/fizmo-*.zip
            build/fizmo-*.7z
            build/fizmo-*.exe
          if-no-files-found: error

  publish:
    name: Attach packages to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-i686, mingw, msvc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*
          fail_on_unmatched_files: true
