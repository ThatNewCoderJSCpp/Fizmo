name: Android build

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON \
            -DFIZMO_TUNE=OFF -DFIZMO_BUILD_SHARED=OFF -DFIZMO_BUILD_SHADER_TOOL=OFF \
            -DFIZMO_BUILD_AUDIO_TESTS=ON -DFIZMO_BUILD_VIDEO_TESTS=ON

      - name: Build
        run: cmake --build build -j 4

      - name: Check the audio and video test programs were built
        run: |
          set -e
          test -x build/fizmo-audio-tests
          test -x build/fizmo-video-demux-tests
          ls -l build/fizmo-audio-*tests build/fizmo-video-*-tests

      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/fizmo-android"
