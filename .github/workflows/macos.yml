name: macOS build

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: matrix.arch == 'arm64'
        run: |
          brew update
          brew install ninja pkg-config fontconfig freetype harfbuzz openssl@3 jpeg-turbo zlib vulkan-headers vulkan-loader molten-vk
          echo "FIZMO_VULKAN_INC=$(brew --prefix vulkan-headers)/include" >> "$GITHUB_ENV"

      - name: Install dependencies (Intel)
        if: matrix.arch == 'x86_64'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew list --versions ninja pkgconf fontconfig freetype harfbuzz openssl@3 jpeg-turbo
          git clone --depth 1 --branch v1.4.363 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
          echo "FIZMO_VULKAN_INC=$RUNNER_TEMP/vulkan-headers/include" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          prefix=$(brew --prefix)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFIZMO_TUNE=OFF -DFIZMO_BUILD_NUMERICS_TESTS=ON -DFIZMO_BUILD_CHEMISTRY_TESTS=ON -DFIZMO_BUILD_PHYSICS_TESTS=ON -DFIZMO_BUILD_LIGHTING_TESTS=ON \
            -DFIZMO_BUILD_AUDIO_TESTS=ON -DFIZMO_BUILD_VIDEO_TESTS=ON \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DFIZMO_VULKAN_INCLUDE_DIR="$FIZMO_VULKAN_INC" \
            -DCMAKE_PREFIX_PATH="$prefix;$(brew --prefix jpeg-turbo);$(brew --prefix zlib)"

      - name: Build
        run: cmake --build build -j 4 -- -k 0

      - name: Run the numerics tests
        run: build/fizmo-numerics-tests

      - name: Run the chemistry tests
        run: build/fizmo-chemistry-tests

      - name: Run the physics tests
        run: build/fizmo-physics-tests

      - name: Run the lighting tests
        run: build/fizmo-lighting-tests

      - name: Run the audio and video tests
        run: |
          set -e
          ls build/fizmo-audio-tests build/fizmo-video-demux-tests > /dev/null
          for t in build/fizmo-audio-tests build/fizmo-audio-*-tests build/fizmo-video-*-tests; do
            echo "::group::$t"
            "$t"
            echo "::endgroup::"
          done

      - name: Core Audio device enumeration smoke test
        run: |
          cat > "$RUNNER_TEMP/coreaudio_smoke.cpp" <<'EOF'
          #include "Audio/device.hpp"
          #include <cstdio>
          #include <string>
          int main() {
              using namespace fizmo::audio;
              std::string err;
              if (!set_backend("coreaudio", &err)) {
                  std::printf("the Core Audio backend didn't start: %s\n", err.c_str());
                  return 1;
              }
              const std::vector<DeviceInfo> list = devices();
              std::printf("backend %s, %zu devices\n", backend_name().c_str(), list.size());
              for (const DeviceInfo& d : list) {
                  std::printf("  %-8s %s%s [%s] %u Hz %u ch\n", device_kind_name(d.kind), d.name.c_str(), d.is_default ? " (default)" : "", d.id.c_str(), d.sample_rate, d.channels);
                  if (d.backend != "coreaudio" || d.id.empty()) return 1;
              }
              Stream missing;
              StreamConfig mc;
              mc.device = "no-such-device-anywhere";
              if (missing.open_playback(mc, [](float*, std::size_t) {}, &err) || err.empty()) return 1;
              std::printf("opening a missing device fails with: %s\n", err.c_str());
              if (default_device(DeviceKind::output)) {
                  Stream out;
                  StreamConfig oc;
                  oc.sample_rate = 44100;
                  oc.channels = 2;
                  if (out.open_playback(oc, [](float* o, std::size_t n) { for (std::size_t i = 0; i < n * 2; ++i) o[i] = 0.0f; }, &err) && out.start(&err)) {
                      std::printf("opened silent playback on '%s' (%u Hz, %u ch, latency %u frames)\n", out.device_name().c_str(), out.sample_rate(), out.channels(), out.latency_frames());
                      out.close();
                  } else {
                      std::printf("couldn't open playback on the default output (tolerated on CI): %s\n", err.c_str());
                  }
              } else {
                  std::printf("no output devices on this machine; skipping the playback check\n");
              }
              return 0;
          }
          EOF
          c++ -std=c++17 -I Source "$RUNNER_TEMP/coreaudio_smoke.cpp" build/libfizmo_audio.a build/libfizmo_core.a \
            -framework CoreAudio -framework AudioToolbox -framework AudioUnit -framework CoreFoundation \
            -framework CoreServices -framework IOKit -o "$RUNNER_TEMP/coreaudio_smoke"
          "$RUNNER_TEMP/coreaudio_smoke"
